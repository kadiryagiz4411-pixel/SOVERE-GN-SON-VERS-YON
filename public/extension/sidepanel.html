<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sovereign Side Panel</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090B;
        --card: #111113;
        --line: rgba(212, 175, 55, 0.22);
        --gold: #d4af37;
        --gold-2: #f5d76e;
        --muted: #a8a29e;
        --text: #f5f5f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(1200px 400px at 50% -80px, rgba(212, 175, 55, 0.12), transparent 55%), var(--bg);
        color: var(--text);
        padding: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        border: 1px solid var(--line);
      }
      .brand h1 {
        font-size: 11px;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0;
      }
      .brand p {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 12px;
        font-weight: 700;
        cursor: pointer;
        font-size: 13px;
        font-family: inherit;
      }
      .primary {
        width: 100%;
        background: linear-gradient(90deg, var(--gold), #b8860b);
        color: #111;
      }
      .primary:disabled, .ghost:disabled, .fill:disabled, .cv:disabled, .b2b:disabled { opacity: .5; cursor: default; }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .row.single { grid-template-columns: 1fr; }
      .ghost {
        background: transparent;
        color: var(--gold-2);
        border: 1px solid var(--line);
      }
      .fill {
        background: #064e3b;
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.35);
      }
      .cv {
        background: #1e3a5f;
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.35);
      }
      .b2b {
        background: #3f2a0a;
        color: #f5d76e;
        border: 1px solid rgba(212, 175, 55, 0.35);
      }
      #status { font-size: 12px; color: var(--muted); min-height: 18px; margin: 12px 0; }
      .spinner {
        display: none;
        width: 22px; height: 22px;
        border: 2px solid #27272a;
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin .8s linear infinite;
        margin: 8px auto;
      }
      .spinner.on { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .card {
        display: none;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.04), 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .card.on { display: block; }
      .mode-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .04em;
        color: #09090B;
        background: linear-gradient(90deg, var(--gold-2), var(--gold));
        border-radius: 999px;
        padding: 5px 10px;
        margin-bottom: 12px;
      }
      .score-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .score {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), #27272a 0);
      }
      .score span {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--bg);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        color: var(--gold-2);
      }
      .title { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
      .meta { font-size: 11px; color: var(--muted); word-break: break-all; }
      .k {
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 14px 0 6px;
      }
      .pain, .proposal {
        font-size: 12px;
        line-height: 1.5;
        color: #e7e5e4;
        white-space: pre-wrap;
        margin: 0;
      }
      .proposal {
        padding: 10px;
        border-radius: 10px;
        background: #09090B;
        border: 1px solid #27272a;
        max-height: 220px;
        overflow: auto;
      }
      .err { color: #fca5a5; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/icon48.png" alt="Sovereign" />
      <div>
        <h1>Sovereign Intelligence</h1>
        <p>Zero-friction · reads the active tab</p>
      </div>
    </div>
    <button id="analyze" class="primary">Analyze Active Page</button>
    <div id="spinner" class="spinner"></div>
    <p id="status">Opening this panel reads the active tab automatically.</p>
    <div id="card" class="card">
      <div id="modeBadge" class="mode-badge">Detected: Page</div>
      <div class="score-row">
        <div id="scoreRing" class="score" style="--p:0">
          <span id="badge">—</span>
        </div>
        <div>
          <p id="title" class="title"></p>
          <p id="meta" class="meta"></p>
        </div>
      </div>
      <div class="k" id="scoreHeading">Score</div>
      <p id="scoreLabel" class="pain"></p>
      <div class="k" id="painHeading">Insight</div>
      <p id="pain" class="pain"></p>
      <div class="k" id="bodyHeading">Output</div>
      <p id="proposal" class="proposal"></p>
      <div id="actionsJob" class="row hidden">
        <button id="copy" class="ghost" type="button">Copy Proposal</button>
        <button id="autofill" class="fill" type="button">Auto-Fill Proposal</button>
      </div>
      <div id="actionsCv" class="row single hidden">
        <button id="saveCandidate" class="cv" type="button">Save Candidate to Sovereign B2B</button>
      </div>
      <div id="actionsB2b" class="row single hidden">
        <button id="outreach" class="b2b" type="button">Generate Cold Outreach</button>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
