<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sovereign Panel</title>
    <style>
      :root { color-scheme: dark; }
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0b0f19; color: #e7e5e4; }
      h1 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #d4af37; margin: 0 0 12px; }
      button { background: linear-gradient(90deg, #d4af37, #b8860b); border: 0; color: #111; font-weight: 700; padding: 8px 12px; border-radius: 8px; cursor: pointer; width: 100%; }
      pre { white-space: pre-wrap; font-size: 11px; background: #111827; padding: 10px; border-radius: 8px; max-height: 360px; overflow: auto; }
      p { font-size: 12px; color: #a8a29e; }
      input { width: 100%; box-sizing: border-box; margin: 0 0 10px; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e7e5e4; }
    </style>
  </head>
  <body>
    <h1>Sovereign Side Panel</h1>
    <p>API base (your deployed app)</p>
    <input id="api" placeholder="https://your-app.vercel.app" />
    <button id="parse">Parse this tab</button>
    <p id="status">Idle</p>
    <pre id="out">{}</pre>
    <script src="sidepanel.js"></script>
  </body>
</html>
